# A port recipe, not yet a full-data distributed launch configuration.
stage: long_multiview
model:
  checkpoint_family: FL2VA
  camera_encoding: decomposed_spatial_qk
  added_trainable_parameters: 0
  trainable_scope: main_attention
  gradient_checkpointing: true
  flow_velocity: data_minus_noise
  clean_timestep: 1.0
optimizer:
  lr: 1.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 10.0
  gradient_accumulation_steps: 1
  fp32_master_weights: true
data:
  reference: worldviews_dataset.json
  source_count: 19
  subset: null
  height: 448
  width: 832
  fps: 16
  mode: long_multiview
  view_and_duration_sampling: full_reference
  keep_native_monocular_sources: true
  latent_cache_namespace: minimax_h3_fl2va
  temporal_mapping: h3_17n5_padded
  exclude_latent_padding_from_loss: true
  text_encoder: qwen3_vl_32b_layer50
  text_cache_namespace: minimax_h3_qwen3vl32b_layer50
attention:
  autoregressive: true
  cross_view: true
  temporal_encoding: native_h3
  camera_on_temporal_channels: false
reference_training:
  wan_chunk_latents: 5
  context_noise: 0.2
  context_noise_std: 0.1
  context_scale: 1.0
  history_dropout_ratio: 0.1
  resampling_forcing_warmup_steps: 10000
  sp_size: 8
  fs_size: 8
  save_interval: 500
resume:
  stage: short_mono
  model: required
  optimizer: required
  global_step: required
