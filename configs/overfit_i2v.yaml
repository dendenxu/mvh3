parents: [h3_native.yaml]
# Fixed-source convergence experiment. Camera/RF/history settings inherit
# the live WorldViews recipe; native H3 numerical settings come from h3_native.
max_iters: 2048
save_interval: 256
auto_resume: true
generator_cpu_offload: false
h3:
  logdir: local/overfit_i2v
  short_frames: 39
overfit:
  frames: 39
  views: [0, 1]
  row: 0
  eval_interval: 64
  generation_interval: 512
  eval_sigmas: [0.25, 0.5, 0.75, 0.95]
  eval_seed: 70000
  generation_seed: 81000
  minimum_relative_improvement: 0.5
