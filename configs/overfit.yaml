parents: [h3_native.yaml]
# Historical 128-step experiment; do not resume it into the wrapped recipe.
model:
  prope_unwrapped: true
# Fixed real documents, fresh training noise, held-out evaluation seeds.
max_iters: 128
auto_resume: true
save_interval: 32
wandb_project: null
resampling_forcing: false
context_noise: 0.0
context_noise_std: 0.0
inference_context_noise: 0.0
history_dropout_ratio: 0.0
cond_image_max_frames: 1
val_cond_image_max_frames: 1
other_view_cond_ratio: 0.0
val_other_view_cond_ratio: 0.0
# Cached VAE/text features leave room to retain all sharded weights on GPU.
generator_cpu_offload: false
h3:
  text_conditioning: text_only
  scale_conditioning: spatial_rotary
  logdir: local/overfit_native
  short_frames: 39
overfit:
  frames: 39
  views: [0, 1]
  row: 0
  eval_interval: 16
  eval_sigmas: [0.25, 0.5, 0.75, 0.95]
  eval_seed: 70000
  generation_seed: 81000
  minimum_relative_improvement: 0.5
