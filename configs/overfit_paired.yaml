parents: [worldviews.yaml]
# Bounded convergence diagnostic on two complete paired Ours windows.
# This TF-only diagnostic does not select the full-mixture RF warmup.
max_iters: 2048
save_interval: 256
auto_resume: true
generator_cpu_offload: true
resampling_forcing: false
h3:
  logdir: local/overfit_paired
  noise_sampling: shifted_uniform
overfit:
  frames: 77
  views: [0, 1]
  eval_interval: 64
  generation_interval: 512
  eval_sigmas: [0.25, 0.5, 0.75, 0.95]
  eval_seed: 70000
  generation_seed: 81000
  minimum_relative_improvement: 0.5
