# Released FL2VA settings for static-camera initialization parity.
parents:
- worldviews.yaml
model:
  timestep_shift: 12.0
  prope_unwrapped: false
timestep_shift: 12.0
sampling_solver: h3_euler
sampling_steps: 50
vis_sampling_steps: 50
guidance_scale: 1.0
cfg_rescale_factor: 0.0
dataset:
  model_fps: 24
  height: 768
  width: 1344
val_dataset:
  model_fps: 24
  height: 768
  width: 1344
h3:
  text_conditioning: fl2va
  noise_sampling: shifted_uniform
  condition_noise: 0.001
  condition_encode_seed: 42
  scale_conditioning: camera_geometry
