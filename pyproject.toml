[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvh3"
version = "0.2.0"
description = "Parameter-free camera encoding and two-stage adaptation for MiniMax H3"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.12",
    "huggingface-hub==1.30.0",
    "safetensors>=0.4.3",
    "pyyaml>=6",
    "omegaconf>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "diffusers @ git+https://github.com/huggingface/diffusers.git@d30c748f5f5d0925a5af14dc0e6a6de983025e63"]
verification = [
    "torch>=2.7",
    "transformers>=5.9.0",
    "accelerate>=1.2.1",
    "numpy>=1.26",
    "scipy>=1.10",
    "pyarrow>=17",
    "opencv-python-headless>=4.10",
]
train = [
    "torch>=2.12",
    "transformers>=5.9.0",
    "accelerate>=1.2.1",
    "numpy>=1.26", "scipy>=1.10", "pyarrow>=17",
    "opencv-python-headless>=4.10", "pillow", "av", "torchcodec",
    "imageio", "imageio-ffmpeg", "pycolmap",
    "h5py", "rich", "ujson", "ruamel.yaml", "tqdm", "wandb",
    "ninja", "pybind11",
    "flash-attn-4==4.0.0b18", "nvidia-cutlass-dsl==4.5.2",
]

[tool.setuptools.packages.find]
include = ["h3*", "model*", "trainer*", "pipeline*", "dataset*", "utils*", "configs*"]

[tool.setuptools.package-data]
"h3.modules" = ["wigner_bases.json"]
"utils" = ["cpp/*.cpp"]
"configs" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
